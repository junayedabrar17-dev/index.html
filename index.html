<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efad | Level 19 Unlocked</title>
    <style>
        :root {
            --bg-main: #0d1117;
            --card-bg: #161b22;
            --accent-green: #2ea44f;
            --accent-glow: #3fb950;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --border-color: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 20px 0 40px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .badge {
            display: inline-block;
            background: rgba(46, 164, 79, 0.15);
            color: var(--accent-glow);
            border: 1px solid var(--accent-green);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 2.5rem;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .tagline {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .message-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent-green);
            padding: 20px 24px;
            border-radius: 8px;
            margin: 30px 0;
        }

        .message-box p {
            font-size: 1.05rem;
            color: var(--text-primary);
        }

        .interests-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 30px 0;
        }

        .interest-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            transition: border-color 0.2s ease;
        }

        .interest-card:hover {
            border-color: var(--accent-green);
        }

        .interest-card .icon {
            font-size: 1.8rem;
            margin-bottom: 8px;
            display: block;
        }

        .interest-card h3 {
            font-size: 1.1rem;
            color: var(--text-primary);
        }

        .gallery-title {
            font-size: 1.3rem;
            margin: 40px 0 15px 0;
            color: var(--text-primary);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .gallery-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 1 / 1;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.03);
        }

        footer {
            text-align: center;
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <span class="badge">Level 19 Unlocked</span>
        <h1>Happy Birthday, Efad</h1>
        <p class="tagline">Est. 2007 • Gamer, Footballer & Music Lover</p>
    </header>

    <div class="message-box">
        <p>Happy 19th, Efad! You're legally an adult now, but we both know nothing has actually changed.</p>
    </div>

    <div class="interests-grid">
        <div class="interest-card">
            <span class="icon">🎮</span>
            <h3>Gaming</h3>
        </div>
        <div class="interest-card">
            <span class="icon">⚽</span>
            <h3>Football</h3>
        </div>
        <div class="interest-card">
            <span class="icon">🎧</span>
            <h3>Music</h3>
        </div>
    </div>

    <h2 class="gallery-title">Photos</h2>
    <div class="gallery-grid">
        <!-- Make sure to place image files in the same folder as this index.html -->
        <div class="gallery-item">
            <img src="18263.jpg" alt="Efad with Medal">
        </div>
        <div class="gallery-item">
            <img src="18261.jpg" alt="Efad Outdoor">
        </div>
        <div class="gallery-item">
            <img src="18259.jpg" alt="Efad Style">
        </div>
        <div class="gallery-item">
            <img src="18257.jpg" alt="Efad Scenic">
        </div>
        <div class="gallery-item">
            <img src="18265.jpg" alt="Efad Cap">
        </div>
    </div>

    <footer>
        <p>Built for Efad's Birthday • Hosted on GitHub Pages</p>
    </footer>
</div>

</body>
</html>
